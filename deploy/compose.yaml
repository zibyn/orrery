services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: stars
      POSTGRES_DB: stars
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stars -d stars"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    # The e2e-only profile keeps the reference deployment free of a test IdP.
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    volumes:
      - "${STARS_DEX_DIR:-.}:/etc/dex:ro"
    ports:
      - "15556:5556"

  # The e2e Git backend. scripts/e2e.sh creates the administrator, the OAuth2
  # application and the link-flow user through the Gitea CLI and API before the
  # Control Plane starts.
  gitea:
    image: gitea/gitea:1.24.6
    # The e2e Git backend; the reference deployment does not start it.
    profiles: ["e2e"]
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "${STARS_GITEA_URL:-http://127.0.0.1:13000}/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__oauth2__ENABLED: "true"
      # A short-lived access token and rotating refresh tokens make the
      # git-refresh scenario prove that concurrent refresh is serialized: a
      # second refresh with the same token would be rejected upstream.
      GITEA__oauth2__ACCESS_TOKEN_EXPIRATION_TIME: "120"
      GITEA__oauth2__INVALIDATE_REFRESH_TOKENS: "true"
    volumes:
      - gitea-data:/data
    ports:
      - "13000:3000"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      STARS_DATABASE_URL: postgres://stars:stars@postgres:5432/stars?sslmode=disable
      STARS_API_ADDR: ":8080"
      STARS_NODE_ADDR: ":8081"
      STARS_NODE_TLS_CERT: /tls/server.crt
      STARS_NODE_TLS_KEY: /tls/server.key
      STARS_DEFAULT_SNAPSHOT_DIGEST: "${STARS_DEFAULT_SNAPSHOT_DIGEST:-}"
      STARS_EXEC_LOG_CAP: "${STARS_EXEC_LOG_CAP:-}"
      STARS_EXEC_LOG_RETENTION: "${STARS_EXEC_LOG_RETENTION:-}"
      STARS_AUDIT_RETENTION: "${STARS_AUDIT_RETENTION:-}"
      STARS_PTY_IDLE_SECONDS: "${STARS_PTY_IDLE_SECONDS:-}"
      STARS_IDLE_STOP_SECONDS: "${STARS_IDLE_STOP_SECONDS:-}"
      STARS_ADMISSION_TIMEOUT: "${STARS_ADMISSION_TIMEOUT:-}"
      STARS_APPS_DOMAIN: "${STARS_APPS_DOMAIN:-}"
      STARS_PORT_TICKET_KEY: "${STARS_PORT_TICKET_KEY:-}"
      STARS_ENCRYPTION_KEYS_FILE: "${STARS_ENCRYPTION_KEYS_FILE:-}"
      STARS_ACCESS_URL: "${STARS_ACCESS_URL:-}"
      STARS_OIDC_ISSUER_URL: "${STARS_OIDC_ISSUER_URL:-}"
      STARS_OIDC_CLIENT_ID: "${STARS_OIDC_CLIENT_ID:-}"
      STARS_OIDC_CLIENT_SECRET_FILE: "${STARS_OIDC_CLIENT_SECRET_FILE:-}"
      STARS_OIDC_ALLOW_SIGNUPS: "${STARS_OIDC_ALLOW_SIGNUPS:-}"
      STARS_OIDC_EMAIL_DOMAINS: "${STARS_OIDC_EMAIL_DOMAINS:-}"
      STARS_GIT_PROVIDERS_FILE: "${STARS_GIT_PROVIDERS_FILE:-}"
    volumes:
      - "${STARS_NODE_TLS_DIR:-./tls}:/tls:ro"
      - "${STARS_ENCRYPTION_KEYS_DIR:-./keys}:/keys:ro"
      - "${STARS_OIDC_SECRET_DIR:-./oidc}:/oidc:ro"
      - "${STARS_GIT_PROVIDERS_DIR:-./git}:/git:ro"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "18081:8081"

  # An empty Control Plane for the "first OIDC login is the admin" scenario
  # (ADR-0020). It has no Node Agent and serves nothing but the OIDC tests.
  server-oidc:
    profiles: ["oidc"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      STARS_DATABASE_URL: postgres://stars:stars@postgres:5432/stars_oidc?sslmode=disable
      STARS_API_ADDR: ":8080"
      STARS_NODE_ADDR: ":8081"
      STARS_NODE_TLS_CERT: /tls/server.crt
      STARS_NODE_TLS_KEY: /tls/server.key
      STARS_ACCESS_URL: "${STARS_OIDC_ACCESS_URL:-}"
      STARS_OIDC_ISSUER_URL: "${STARS_OIDC_ISSUER_URL:-}"
      STARS_OIDC_CLIENT_ID: "${STARS_OIDC_CLIENT_ID:-}"
      STARS_OIDC_CLIENT_SECRET_FILE: "${STARS_OIDC_CLIENT_SECRET_FILE:-}"
      STARS_OIDC_ALLOW_SIGNUPS: "${STARS_OIDC_ALLOW_SIGNUPS:-}"
      STARS_OIDC_EMAIL_DOMAINS: "${STARS_OIDC_EMAIL_DOMAINS:-}"
    volumes:
      - "${STARS_NODE_TLS_DIR:-./tls}:/tls:ro"
      - "${STARS_OIDC_SECRET_DIR:-./oidc}:/oidc:ro"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18082:8080"

volumes:
  gitea-data:
