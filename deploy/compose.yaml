services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: stars
      POSTGRES_DB: stars
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stars -d stars"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # RustFS is the S3-compatible object store (defaults.md). The Control Plane
  # reaches it as http://rustfs:9000; Nodes reach the host-mapped
  # http://127.0.0.1:19000, which is the address presigned URLs use.
  rustfs:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: "${STARS_S3_ACCESS_KEY:-stars}"
      RUSTFS_SECRET_KEY: "${STARS_S3_SECRET_KEY:-stars-secret}"
    volumes:
      - rustfs-data:/data
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  # One-shot bucket creation; re-running it is harmless.
  rustfs-init:
    image: amazon/aws-cli:2.17.0
    environment:
      AWS_ACCESS_KEY_ID: "${STARS_S3_ACCESS_KEY:-stars}"
      AWS_SECRET_ACCESS_KEY: "${STARS_S3_SECRET_KEY:-stars-secret}"
      AWS_DEFAULT_REGION: "${STARS_S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${STARS_S3_INTERNAL_ENDPOINT:-http://rustfs:9000}"
      S3_BUCKET: "${STARS_S3_BUCKET:-stars}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; do
          aws --endpoint-url "$$S3_ENDPOINT" s3 mb "s3://$$S3_BUCKET" 2>/dev/null || sleep 1
        done
    depends_on:
      rustfs:
        condition: service_healthy

  # The platform OCI registry (ADR-0014). Host networking lets it both reach
  # RustFS at 127.0.0.1:19000 and sign redirects for that same Node-reachable
  # address. Nodes pull from 127.0.0.1:15000.
  registry:
    image: registry:3
    network_mode: host
    environment:
      # Distribution signs blob redirects for this endpoint. Nodes reach the
      # host-mapped 127.0.0.1:19000; in e2e the Control Plane (a container)
      # must reach it too, so the script points this at the bridge gateway.
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "${STARS_REGISTRY_S3_REGIONENDPOINT:-http://127.0.0.1:19000}"
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - ./registry/htpasswd:/etc/distribution/htpasswd:ro
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      # /v2/ answers 401 to anonymous requests, so the healthcheck sends the
      # development credential (base64 of stars:stars-registry-password).
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Authorization: Basic c3RhcnM6c3RhcnMtcmVnaXN0cnktcGFzc3dvcmQ=' http://127.0.0.1:15000/v2/"]
      interval: 2s
      timeout: 3s
      retries: 60

  # An unauthenticated local image source for e2e. Platform Snapshot import
  # must not depend on Docker Hub availability or anonymous rate limits;
  # scripts/e2e.sh pushes the default base image here before the server starts.
  registry-source:
    image: registry:3
    profiles: ["e2e"]
    volumes:
      - registry-source-data:/var/lib/registry
    ports:
      - "15001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    # The e2e-only profile keeps the reference deployment free of a test IdP.
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    volumes:
      - "${STARS_DEX_DIR:-.}:/etc/dex:ro"
    ports:
      - "15556:5556"

  # The e2e Git backend. scripts/e2e.sh creates the administrator, the OAuth2
  # application and the link-flow user through the Gitea CLI and API before the
  # Control Plane starts.
  gitea:
    image: gitea/gitea:1.24.6
    # The e2e Git backend; the reference deployment does not start it.
    profiles: ["e2e"]
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "${STARS_GITEA_URL:-http://127.0.0.1:13000}/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__oauth2__ENABLED: "true"
      # A short-lived access token and rotating refresh tokens make the
      # git-refresh scenario prove that concurrent refresh is serialized: a
      # second refresh with the same token would be rejected upstream.
      GITEA__oauth2__ACCESS_TOKEN_EXPIRATION_TIME: "120"
      GITEA__oauth2__INVALIDATE_REFRESH_TOKENS: "true"
    volumes:
      - gitea-data:/data
    ports:
      - "13000:3000"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Application settings come from the scenario's config.yaml (ADR-0024);
      # these are the keys that have no config.yaml form plus the purge hook.
      STARS_CONFIG_FILE: /config/config.yaml
      STARS_API_ADDR: ":8080"
      STARS_NODE_ADDR: ":8081"
      STARS_NODE_TLS_CERT: /tls/server.crt
      STARS_NODE_TLS_KEY: /tls/server.key
      # Test hook only; production uses the 10-minute constant (defaults.md).
      STARS_TEST_PURGE_INTERVAL: "${STARS_TEST_PURGE_INTERVAL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${STARS_NODE_TLS_DIR:-./tls}:/tls:ro"
      - "${STARS_CONFIG_DIR:-./config}:/config:ro"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "18081:8081"

  # An empty Control Plane for the "first OIDC login is the admin" scenario
  # (ADR-0020). It has no Node Agent and serves nothing but the OIDC tests.
  server-oidc:
    profiles: ["oidc"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      STARS_DATABASE_URL: postgres://stars:stars@postgres:5432/stars_oidc?sslmode=disable
      STARS_API_ADDR: ":8080"
      STARS_NODE_ADDR: ":8081"
      STARS_NODE_TLS_CERT: /tls/server.crt
      STARS_NODE_TLS_KEY: /tls/server.key
      STARS_ACCESS_URL: "${STARS_OIDC_ACCESS_URL:-}"
      STARS_OIDC_ISSUER_URL: "${STARS_OIDC_ISSUER_URL:-}"
      STARS_OIDC_CLIENT_ID: "${STARS_OIDC_CLIENT_ID:-}"
      STARS_OIDC_CLIENT_SECRET_FILE: "${STARS_OIDC_CLIENT_SECRET_FILE:-}"
      STARS_OIDC_ALLOW_SIGNUPS: "${STARS_OIDC_ALLOW_SIGNUPS:-}"
      STARS_OIDC_EMAIL_DOMAINS: "${STARS_OIDC_EMAIL_DOMAINS:-}"
    volumes:
      - "${STARS_NODE_TLS_DIR:-./tls}:/tls:ro"
      - "${STARS_OIDC_SECRET_DIR:-./oidc}:/oidc:ro"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18082:8080"

volumes:
  gitea-data:
  registry-source-data:
  rustfs-data:
