# The e2e OIDC IdP. scripts/e2e.sh fills in the two redirect URIs, which
# depend on the Docker bridge gateway, before Compose starts.
#
# issuer 是 Compose 服务名，Control Plane 用它做 discovery 和换 token；测试里的
# “浏览器” 在宿主机上，把该 host 重写成 127.0.0.1 后访问。
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
# One login form instead of Dex's approval page.
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticClients:
  - id: orrery
    secret: orrery-oidc-secret
    name: orrery
    redirectURIs:
      - __MAIN_CALLBACK__
      - __OIDC_CALLBACK__
staticPasswords:
  # password: oidc-password-123
  - email: oidc-user@example.com
    hash: "$2b$12$I8tHsMcFvzO9iQzm2vvlle.ibhK7AFHbgvR0W7BZbyrNUznZmNDTy"
    username: oidc-user
    userID: oidc-user
