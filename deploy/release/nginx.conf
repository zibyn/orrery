# The release deployment's only public listener (ADR-0023). install.sh copies
# this file to /etc/stars-sandbox/nginx/stars.conf on first install and
# substitutes __LISTEN__, __PUBLIC_HOST__ and __S3_HOST__. Edit that copy and
# run `docker compose restart nginx`; install.sh never overwrites it.
#
# Paths are fixed by the protocols: OCI clients always call /v2/, and gRPC
# derives /stars.node.v1.Node/ from the proto package. Everything else is the
# API. The object store needs its own name because SigV4 signs Host and path.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen __LISTEN__ ssl;
    http2 on;
    server_name __PUBLIC_HOST__;

    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # OCI registry. Uploads stream through nginx; downloads are redirected to
    # the object store.
    location ^~ /v2/ {
        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Node Agent gRPC. The process listener is TLS; this hop is loopback.
    location ^~ /stars.node.v1.Node/ {
        grpc_pass grpcs://127.0.0.1:18081;
        grpc_ssl_verify off;
        # Long-lived streams can be silent for minutes; nginx's 60s default
        # would cut Exec output and PTY attachments.
        grpc_read_timeout 86400s;
        grpc_send_timeout 86400s;
        grpc_socket_keepalive on;
    }

    # API, Web console, file uploads, PTY and port tunnels.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        # The port must survive: sameOrigin compares Host with the browser's
        # Origin, which includes :PORT.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# The object store's own hostname on the same port. The Host header carries the
# port because the presigned URL is signed with it; never rewrite the path.
server {
    listen __LISTEN__ ssl;
    server_name __S3_HOST__;

    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Port forwarding and anything else: the API's Host routing decides. This
# certificate only covers the two hostnames above, so HTTPS port forwarding
# needs --tls cert with a wildcard SAN.
server {
    listen __LISTEN__ ssl default_server;
    server_name _;

    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
