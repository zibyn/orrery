# The release deployment of a Control Plane host (ADR-0023). deploy/install.sh
# downloads this file from the release tag into /etc/stars-sandbox/ and writes
# .env beside it; nothing here is a credential. deploy/compose.yaml stays the
# e2e deployment.
name: stars-sandbox

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: "${STARS_POSTGRES_PASSWORD:?}"
      POSTGRES_DB: stars
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stars -d stars"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${STARS_S3_ACCESS_KEY:?}"
      RUSTFS_SECRET_KEY: "${STARS_S3_SECRET_KEY:?}"
    volumes:
      - rustfs-data:/data
    # Only nginx reaches it; presigned URLs point at nginx's object-store
    # hostname, not this port.
    ports:
      - "${STARS_BIND:-}19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  # install.sh creates the bucket with a one-shot aws-cli container before
  # the registry and the Control Plane start.

  # Host networking lets the registry serve plain HTTP on loopback behind
  # nginx. It signs blob redirects for the public object-store URL and reaches
  # that URL through nginx on loopback; the extra_hosts entry is for the
  # bundled RustFS. install.sh writes its config, which carries the loopback
  # address and credentials.
  registry:
    image: registry:3
    restart: unless-stopped
    network_mode: host
    environment:
      # Self-signed mode: trust the generated CA in addition to system roots.
      SSL_CERT_DIR: /ca:/etc/ssl/certs
    volumes:
      - ./registry:/etc/distribution:ro
      - ./ca:/ca:ro
    # An external object store must remove this loopback mapping.
    extra_hosts:
      - "${STARS_S3_PUBLIC_HOST:?}:${STARS_PUBLIC_RESOLVE:-127.0.0.1}"
    depends_on:
      rustfs:
        condition: service_healthy

  server:
    image: "ghcr.io/zibyn/stars-sandbox-server:${STARS_VERSION:?}"
    restart: unless-stopped
    # Every STARS_* setting (defaults.md) lives in .env.
    env_file: .env
    environment:
      STARS_API_ADDR: ":8080"
      STARS_NODE_ADDR: ":8081"
      STARS_NODE_TLS_CERT: /tls/server.crt
      STARS_NODE_TLS_KEY: /tls/server.key
      STARS_ENCRYPTION_KEYS_FILE: /keys/encryption
      STARS_S3_ENDPOINT: "${STARS_S3_ENDPOINT:-http://rustfs:9000}"
      # Self-signed mode: trust the generated CA for registry pushes, in
      # addition to the system roots.
      SSL_CERT_DIR: /ca:/etc/ssl/certs
    volumes:
      - ./tls:/tls:ro
      - ./ca:/ca:ro
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      # Only nginx reaches these; STARS_BIND is 127.0.0.1: on first install.
      - "${STARS_BIND:-}18080:8080"
      - "${STARS_BIND:-}18081:8081"

  # The only public listener (ADR-0023): TLS in, path routing out to the API,
  # the registry and the node surface, plus the object store's own hostname.
  # install.sh bakes its listener, hostnames and certificate into
  # nginx/stars.conf on first install.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/stars.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/tls:ro
    depends_on:
      server:
        condition: service_started
      registry:
        condition: service_started
      rustfs:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
