# CI gate, images and releases (ADR-0023). Pull requests run the checks and
# the Compose e2e suite once; a push to main or a v* tag only publishes (:main,
# or :X.Y.Z, :latest and the GitHub Release), since the merged PR already
# passed the gate (#179). There is no scheduled run; workflow_dispatch runs
# the full gate, and the Playwright console suite, by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The bundled runtimes (ADR-0028): the release job packs them and
# scripts/ci-e2e-node.sh runs the e2e Node on them. Renovate bumps the
# versions (renovate.json); a bump must update both arches' sha256 in the
# same PR.
env:
  # renovate: datasource=github-releases depName=containerd/containerd extractVersion=^v(?<version>.+)$
  CONTAINERD_VERSION: 2.2.1
  CONTAINERD_SHA256_AMD64: f5d8e90ecb6c1c7e33ecddf8cc268a93b9e5b54e0e850320d765511d76624f41
  CONTAINERD_SHA256_ARM64: dac15a0d412a24be8bfe6a40cec8f51829062725169f1e72ac7d120a891ef5b6
  # renovate: datasource=github-releases depName=opencontainers/runc extractVersion=^v(?<version>.+)$
  RUNC_VERSION: 1.5.2
  RUNC_SHA256_AMD64: 599f6f94ff8c5057241eff0d54c3c74f95c34935b6457b33fe545defc61e9488
  RUNC_SHA256_ARM64: d10ecae898361832a059be2089bab92d158aec54661b18ed7346ed79628b46b0
  # renovate: datasource=github-releases depName=moby/buildkit
  BUILDKIT_VERSION: v0.34.1
  BUILDKIT_SHA256_AMD64: a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b
  BUILDKIT_SHA256_ARM64: c8c97b84baf89dfe0ea85063ac24ad88eb909979ea476ce3ef9e8e11e60ebef8
  # renovate: datasource=github-tags depName=google/gvisor versioning=regex:^release-(?<major>\d{8})\.(?<minor>\d+)$
  GVISOR_VERSION: release-20261026.0
  GVISOR_SHA256_AMD64: 096589d2d6078ba4caa26aa0200932f571aa5da9d08a5156b98ab1d93fa54468
  GVISOR_SHA256_ARM64: 6b03c9d53f46b5ac56fd32522f38f108645e9f80a26a335e86ad1e09dcdaefda

jobs:
  # `check` is the required PR gate and runs on every PR. The e2e suite only
  # runs when the server, agent, CLI, protocol, deployment or the tests
  # themselves change; a web/docs-only PR skips it (#146).
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "origin/${GITHUB_BASE_REF}...HEAD" -- \
            client cmd internal proto gen sdk deploy e2e scripts \
            go.mod go.sum Makefile buf.yaml buf.gen.yaml sqlc.yaml \
            .github/workflows; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # The Exec output store tests skip without ORRERY_TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: orrery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make vet
      - run: make test
        env:
          ORRERY_TEST_DATABASE_URL: postgres://postgres:orrery@localhost:5432/postgres?sslmode=disable
      - run: make web-check
      # `make console` builds the Web console and embeds it (api.md §8).
      - run: make console
      - run: pip install httpx && python -m unittest discover -s sdk/python/tests

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx
      # The runner is the e2e containerd Node: the Agent's own containerd and
      # buildkitd, set up as install.sh does (ADR-0028); the runner's
      # containerd is left alone. It runs before the second Docker daemon starts.
      - run: ./scripts/ci-e2e-node.sh
      # The Compose stack builds on Docker 29 (containerd image store), whose
      # default builder can export the gha cache of deploy/compose.ci.yaml.
      # The action's daemon listens on its own socket, set in DOCKER_HOST.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.9.1
          set-host: true
      # The containerd Agents need root, and they run as the test process's
      # user, so the whole script runs under sudo with the job's environment.
      # GPU and remote-host scenarios skip themselves without ORRERY_E2E_GPU_SSH.
      - run: sudo -E env "PATH=$PATH" ./scripts/e2e.sh -timeout 80m
        env:
          # CI-only BuildKit cache; local e2e runs keep the plain build
          # (deploy/compose.ci.yaml).
          ORRERY_E2E_COMPOSE_OVERRIDE: ${{ github.workspace }}/deploy/compose.ci.yaml

  # Playwright is slow and not a merge gate; it runs on demand.
  e2e-console:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The console's Node Agent is a root containerd Agent, as in `e2e`.
      - run: ./scripts/ci-e2e-node.sh
      - run: sudo -E env "PATH=$PATH" make e2e-console

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Only the final alpine stage runs on the target architecture; the Web
      # and Go stages cross-compile on the build platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orrery-server
          # semver also tags :latest; a push to main tags :main. The vX.Y.Z
          # tag is what release compose.yaml pulls (ORRERY_VERSION is the git tag).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag on a release build, the branch on a main push.
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # install.sh pins the release's images by digest; publish them first.
    needs: [image, sandbox-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Go stamps the tag into each binary's build info, which is the version
      # the Agent reports in its handshake (ADR-0014); that needs the tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The bundled runtimes' versions and sha256 are the workflow env.
      - name: Build the Node package and the CLI
        run: |
          set -euo pipefail
          v="$GITHUB_REF_NAME"
          mkdir dist
          build() { # os arch out-dir binaries...
            local os="$1" arch="$2" out="$3"; shift 3
            for bin in "$@"; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$out/$bin" "./cmd/$bin"
            done
          }
          # Everything sits flat in bin/, plus runsc's gvisor-bin/ sidecars,
          # for install.sh to copy as is to /opt/orrery/bin/. The Agent finds
          # the CLI beside its own executable (runtime.md).
          for arch in amd64 arm64; do
            pkg="$(mktemp -d)"
            mkdir "$pkg/bin"
            build linux "$arch" "$pkg/bin" orrery-agent orrery
            ./scripts/fetch-runtimes.sh "$arch" "$pkg/bin"
            tar -C "$pkg" --owner=0 --group=0 -czf "dist/orrery-node_${v}_linux_${arch}.tar.gz" bin
          done
          for arch in amd64 arm64; do
            d="$(mktemp -d)"
            build darwin "$arch" "$d" orrery
            tar -C "$d" -czf "dist/orrery_${v}_darwin_${arch}.tar.gz" orrery
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      # A hyphen marks a semver prerelease; releases/latest must skip it, since
      # install.sh without --version installs releases/latest.
      - name: Publish the release
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  # Platform Snapshot images (deploy/sandbox), tagged like orrery-server so
  # install.sh pins the one matching its version (#235).
  sandbox-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: orrery-sandbox
            base: ubuntu:24.04
            platforms: linux/amd64,linux/arm64
          # CUDA Nodes are amd64; an arm64 build doubles a multi-GB emulated build.
          - image: orrery-sandbox-cuda
            base: nvidia/cuda:12.8.1-runtime-ubuntu24.04
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BASE=${{ matrix.base }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
