syntax = "proto3";

package stars.node.v1;

option go_package = "github.com/zibyn/stars-sandbox/gen/node/v1;nodev1";

// Node is the Agent-facing service on the `node` listener
// (docs/spec/node-protocol.md).
service Node {
  // Redeem is the only unauthenticated entry point: an Enrollment Packet buys
  // one Node Token. Both travel over TLS.
  rpc Redeem(RedeemRequest) returns (RedeemResponse);
  // Control is one long-lived stream per Agent.
  rpc Control(stream AgentMessage) returns (stream ControlMessage);
  // ExecOutput is one stream per Exec: frames up, acknowledgements down.
  rpc ExecOutput(stream OutputBatch) returns (stream OutputAck);
  // Tunnel is a reverse-dialled raw byte stream, opened when Control sends
  // OpenTunnel (ADR-0018).
  rpc Tunnel(stream TunnelFrame) returns (stream TunnelFrame);
}

message RedeemRequest {
  string packet = 1;
  string name = 2;
  string agent_version = 3;
  uint32 proto_major = 4;
  uint32 proto_minor = 5;
}

message RedeemResponse {
  string node_id = 1;
  // Plaintext Node Token; shown only in this response.
  string node_token = 2;
}

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Capabilities capabilities = 3;
    SandboxObserved sandbox_observed = 4;
    WorkspaceObserved workspace_observed = 5;
    CommandResult command_result = 6;
    ExecObserved exec_observed = 7;
  }
}

message Hello {
  string node_id = 1;
  string agent_version = 2;
  uint32 proto_major = 3;
  uint32 proto_minor = 4;
}

message Heartbeat {
  // "healthy" or "unhealthy".
  string runtime_health = 1;
  uint64 disk_free = 2;
  repeated GPUHealth gpu_health = 3;
  // Host totals and the Node's own reservation (defaults.md), used for
  // placement.
  double cpu_cores = 4;
  uint64 memory_bytes = 5;
  double reserved_cpu = 6;
  uint64 reserved_memory = 7;
  // Disk capacity, so the Control Plane can apply the disk watermark.
  uint64 disk_total = 8;
  // Fraction of the disk that must stay free before the Node takes new
  // allocations (defaults.md, Node configuration).
  double disk_watermark = 9;
}

message GPUHealth {
  string uuid = 1;
  string state = 2;
}

message Capabilities {
  string runtime = 1;
  repeated CapabilityEntry entries = 2;
  repeated GPU gpus = 3;
}

message CapabilityEntry {
  string name = 1;
  CapabilityValue value = 2;
}

enum CapabilityValue {
  CAPABILITY_VALUE_UNSPECIFIED = 0;
  CAPABILITY_VALUE_ENFORCED = 1;
  CAPABILITY_VALUE_BEST_EFFORT = 2;
  CAPABILITY_VALUE_UNSUPPORTED = 3;
}

message GPU {
  string uuid = 1;
  string model = 2;
}

message SandboxObserved {
  string sandbox_id = 1;
  int64 generation = 2;
  // "running", "gone" or "create_failed".
  string phase = 3;
  string cause = 4;
}

message WorkspaceObserved {
  string workspace_id = 1;
  int64 generation = 2;
  // "ready" or "gone".
  string phase = 3;
  string cause = 4;
}

message CommandResult {
  string command_id = 1;
  string error = 2;
}

message ExecObserved {
  string exec_id = 1;
  // RFC 3339, read from the Supervisor's `started` file.
  string started_at = 2;
}

message ControlMessage {
  oneof message {
    HelloAck hello_ack = 1;
    ProvisionWorkspace provision_workspace = 2;
    DeleteWorkspace delete_workspace = 3;
    CreateSandbox create_sandbox = 4;
    StopSandbox stop_sandbox = 5;
    StartExec start_exec = 6;
    CancelExec cancel_exec = 7;
    OpenTunnel open_tunnel = 8;
  }
}

message OpenTunnel {
  string command_id = 1;
  string tunnel_id = 2;
  oneof target {
    AgentHTTP agent_http = 3;
    SandboxPort sandbox_port = 4;
  }
}

// AgentHTTP targets the Agent's internal HTTP surface: the Gateway
// reverse-proxies to it verbatim.
message AgentHTTP {}

// SandboxPort targets a port inside a Sandbox's network namespace.
message SandboxPort {
  string sandbox_id = 1;
  int32 port = 2;
}

message TunnelFrame {
  string tunnel_id = 1;
  bytes data = 2;
}

message PtySpec {
  int32 rows = 1;
  int32 cols = 2;
}

message ProvisionWorkspace {
  string command_id = 1;
  string workspace_id = 2;
  int64 generation = 3;
}

message DeleteWorkspace {
  string command_id = 1;
  string workspace_id = 2;
  int64 generation = 3;
}

message CreateSandbox {
  string command_id = 1;
  string sandbox_id = 2;
  int64 generation = 3;
  // name@sha256:... pinned image digest.
  string image_digest = 4;
  Limits limits = 5;
  WorkspaceMount workspace = 6;
  // GPU, Resource and Secret mounts arrive with later tickets.
}

message Limits {
  // Cores, e.g. 0.5.
  double cpu = 1;
  int64 memory = 2;
}

message WorkspaceMount {
  string workspace_id = 1;
  // "rw" or "ro".
  string mode = 2;
}

message StopSandbox {
  string command_id = 1;
  string sandbox_id = 2;
  int64 generation = 3;
}

message StartExec {
  string command_id = 1;
  string exec_id = 2;
  string sandbox_id = 3;
  int64 generation = 4;
  repeated string argv = 5;
  map<string, string> env = 6;
  map<string, string> secret_env = 7;
  string cwd = 8;
  int64 timeout_seconds = 9;
  int64 log_cap = 10;
  bytes stdin = 11;
  // Set for a PTY Exec; its output travels only over the tunnel (ADR-0017).
  PtySpec pty = 12;
  // PTY idle reap after the last Attachment detaches (defaults.md, 300 s).
  int64 pty_idle_seconds = 13;
}

message CancelExec {
  string command_id = 1;
  string exec_id = 2;
}

message OutputFrame {
  // Byte offset of this frame in the Node's `output` record.
  int64 seq = 1;
  // "stdout", "stderr", "truncated" or "exit".
  string stream = 2;
  bytes data = 3;
  // Set only on the exit frame.
  string cause = 4;
  optional int32 exit_code = 5;
  optional int32 signal = 6;
}

message OutputBatch {
  string exec_id = 1;
  repeated OutputFrame frames = 2;
}

message OutputAck {
  string exec_id = 1;
  int64 stored_seq = 2;
}

message HelloAck {
  bool accepted = 1;
  // Empty until the OCI registry exists (M4).
  string registry_credential = 2;
}
