[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stars-sandbox"
version = "0.1.0"
description = "Synchronous Python client for the Stars Sandbox public REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/zibyn/stars-sandbox"

[tool.setuptools.packages.find]
include = ["stars_sandbox*"]
